[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wolfpack-agents"
version = "0.1.0"
description = "Foundation scaffold for the WolfPack multi-agent SOC assistant."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "WolfPack Contributors" },
]
dependencies = [
  "asyncpg>=0.30.0",
  "cryptography>=42.0.0",
  "haystack-ai>=2.14.0",
  "httpx>=0.28.1",
  "langgraph>=0.6.7",
  "logfire>=4.14.1",
  "mlflow>=3.5.1",
  "nats-py>=2.11.0",
  "opentelemetry-api>=1.38.0",
  "opentelemetry-exporter-otlp>=1.38.0",
  "opentelemetry-instrumentation-asyncpg>=0.59b0",
  "opentelemetry-instrumentation-httpx>=0.59b0",
  "opentelemetry-sdk>=1.38.0",
  "pydantic>=2.11.9",
  "pydantic-ai>=1.0.15",
  "pydantic-settings>=2.11.0",
  "typer>=0.19.2",
]

[project.optional-dependencies]
presidio = [
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
]

[project.scripts]
wolfpack-smoke = "wolfpack.smoke.hello_pack:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wolfpack"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100


[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "S", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing"

[tool.bandit]
targets = ["src"]
severity = "medium"
confidence = "medium"

[tool.poetry]
name = "ai-sandbox"
version = "0.1.0"
description = "AI-assisted development sandbox"
authors = ["SarahSL <sarahsl@cybercrone.tech>"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.34"
langchain = "^0.3"
langchain-anthropic = "^0.2"
pydantic = "^2.7"
httpx = "^0.27"
rich = "^13"
typer = {extras = ["all"], version = "^0.12"}

[tool.poetry.group.dev.dependencies]
pylint = "^3.2"
mypy = "^1.10"
black = "^24"
isort = "^5.13"
ruff = "^0.5"
pytest = "^8"
pytest-asyncio = "^0.23"
pytest-cov = "^5"
ipykernel = "^6"  # Jupyter support

[tool.poetry.group.security.dependencies]
bandit = {extras = ["toml"], version = "^1.7"}
safety = "^3"
pip-audit = "^2.7"
semgrep = "^1.75"

[dependency-groups]
dev = [
  "alembic>=1.14.0",
  "mypy>=1.18.2",
  "pre-commit>=4.3.0",
  "psycopg2-binary>=2.9.10",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "respx>=0.22.0",
  "ruff>=0.14.0",
  "testcontainers[nats,postgres]>=4.13.2",
]
