[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wolfpack-agents"
version = "0.1.0"
description = "Foundation scaffold for the WolfPack multi-agent SOC assistant."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "WolfPack Contributors" },
]
dependencies = [
  "asyncpg>=0.30.0",
  "cryptography>=42.0.0",
  "haystack-ai>=2.14.0",
  "httpx>=0.28.1",
  "langgraph>=0.6.7",
  "logfire>=4.14.1",
  "mlflow>=3.5.1",
  "nats-py>=2.11.0",
  "opentelemetry-api>=1.38.0",
  "opentelemetry-exporter-otlp>=1.38.0",
  "opentelemetry-instrumentation-asyncpg>=0.59b0",
  "opentelemetry-instrumentation-httpx>=0.59b0",
  "opentelemetry-sdk>=1.38.0",
  "pydantic>=2.11.9",
  "pydantic-ai>=1.0.15",
  "pydantic-settings>=2.11.0",
  "typer>=0.19.2",
]

[project.optional-dependencies]
presidio = [
  "presidio-analyzer>=2.2.0",
  "presidio-anonymizer>=2.2.0",
]

[project.scripts]
wolfpack-smoke = "wolfpack.smoke.hello_pack:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wolfpack"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "alembic>=1.14.0",
  "mypy>=1.18.2",
  "pre-commit>=4.3.0",
  "psycopg2-binary>=2.9.10",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "respx>=0.22.0",
  "ruff>=0.14.0",
  "testcontainers[nats,postgres]>=4.13.2",
]
