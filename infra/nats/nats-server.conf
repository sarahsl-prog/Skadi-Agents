# WolfPack NATS server configuration.
# JetStream is required for durable task/finding/branch/status streams.

server_name: wolfpack-nats

# Enable JetStream with a data directory inside the container.
jetstream {
    store_dir: "/data"
    # 1 GB default; override in docker-compose if needed.
    max_mem_store: 1073741824
    max_file_store: 10737418240
}

# Development defaults — no auth. Production config is injected via
# docker-compose.override.yml or a mounted secret.
authorization {
    users: []
}

# Listen on the default port inside the container.
port: 4222

# Monitoring endpoint (healthchecks use this).
monitor_port: 8222