# See https://pre-commit.com for details.
# Install:    pip install pre-commit && pre-commit install
# Run on all: pre-commit run --all-files

default_language_version:
  python: python3.11

repos:
  # Generic file hygiene and safety checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ['--maxkb=3000']
      - id: detect-private-key

  # Secret scanning — fits the security focus of this project.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Python lint + format. No-op until code lands; ready when it does.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: pytest-unit
        name: pytest-unit
        entry: uv run pytest -q tests/unit
        language: system
        pass_filenames: false
